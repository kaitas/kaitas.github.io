[project]
name = "award-triage"
version = "0.1.0"
description = "International AI Creator Award 2026 - multilingual intake + first-round screening assist"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.scripts]
award-triage = "award_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["award_triage*"]
